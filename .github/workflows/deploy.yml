name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]

  # Consente di eseguire questo workflow manualmente dalla scheda Actions
  workflow_dispatch:

# Imposta i permessi di GITHUB_TOKEN per consentire il deployment su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Consente una sola esecuzione simultanea
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # default path

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Utilizza Node 22 (conforme al package.json >=22.12.0)
          cache: 'npm'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: ${{ env.BUILD_PATH }}

      - name: Build Astro
        run: |
          npx astro build \
            --site "${{ steps.pages.outputs.origin }}" \
            --base "${{ steps.pages.outputs.base_path }}"
        working-directory: ${{ env.BUILD_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
